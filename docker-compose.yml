# Local Postgres 16 for development. This is the database only; the web
# server and the realtime gateway run on the host with npm scripts.
#
#   docker compose up -d
#   npm run db:migrate && npm run db:seed && npm run db:verify
#
# with these in .env.local:
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/elections
#   APP_DATABASE_URL=postgres://app:app_local_dev@localhost:5432/elections
#   APP_DB_PASSWORD=app_local_dev
#
# The port is bound to 127.0.0.1 so the database, and its public dev
# passwords, are never reachable from other machines.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elections
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elections"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
